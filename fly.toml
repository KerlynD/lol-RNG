# fly.toml — lol-RNG Discord bot.
# Bot is outbound-only (Discord gateway websocket) — no HTTP service block.
#
# Deploy:
#   fly secrets set DISCORD_TOKEN=... DISCORD_GUILD_ID=... DATABASE_URL=... DROP_WEIGHT_SEED=...
#   fly deploy

app = 'lol-rng'
primary_region = 'iad'

[build]

[env]
  LOG_LEVEL = 'INFO'

[processes]
  bot = 'python -m bot.main'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
